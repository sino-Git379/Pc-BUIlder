# =============================================================================
# RigForge Nginx Reverse Proxy Configuration
# =============================================================================

upstream django_upstream {
    server web:8000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP Server (Port 80)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    # =========================================================================
    # PLACEHOLDER: Replace 'your_domain.com' with your actual production domain!
    # Example: server_name rigforge.com www.rigforge.com localhost;
    # =========================================================================
    server_name student3.softclub.tj www.student3.softclub.tj 157.180.29.248 localhost 127.0.0.1;

    client_max_body_size 50M;

    # Gzip Compression for high performance asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static files collected from Django & built Vite bundle
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # User uploaded hardware photos, voice recordings, attachments
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # WebSocket connection for RigForge real-time messenger & live updates
    location /ws/ {
        proxy_pass http://django_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # Standard HTTP API & SPA Routing
    location / {
        proxy_pass http://django_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

