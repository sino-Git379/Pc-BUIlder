{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PCForge{% endblock %}</title>
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('pcforge.theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="{% static 'js/tailwind-config.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/stitch.css' %}">{% block page_css %}{% endblock %}</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col transition-colors duration-200">{% block content %}{% endblock %}
<script src="{% static 'js/i18n.js' %}" defer></script><script src="{% static 'js/api.js' %}" defer></script>{% block page_js %}{% endblock %}</body></html>
