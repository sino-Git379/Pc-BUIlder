    container_name: student3-rigforge
    restart: always
    ports:
      - "127.0.0.1:8033:8000"
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=student3.softclub.tj,www.student3.softclub.tj,157.180.29.248,localhost,127.0.0.1,*
      - CSRF_TRUSTED_ORIGINS=https://student3.softclub.tj,http://student3.softclub.tj,http://157.180.29.248,http://localhost,http://127.0.0.1
